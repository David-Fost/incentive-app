<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}НИИ — Стимулирующие надбавки{% endblock %}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans"', 'sans-serif'],
            serif: ['"IBM Plex Serif"', 'serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            },
          },
          boxShadow: {
            'card': '0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.06)',
            'card-md': '0 4px 12px 0 rgb(0 0 0 / 0.07), 0 2px 6px -2px rgb(0 0 0 / 0.05)',
            'sidebar': '1px 0 0 0 #e5e7eb',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: IBM Plex -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>

  <style>
    * { font-family: 'IBM Plex Sans', sans-serif; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

    /* Sidebar nav link */
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; border-radius: 8px;
      font-size: 14px; font-weight: 500; color: #4b5563;
      transition: all .18s ease; text-decoration: none;
    }
    .nav-link:hover { background: #f3f4f6; color: #111827; }
    .nav-link.active { background: #eef2ff; color: #4338ca; }
    .nav-link.active .ph { color: #4338ca; }
    .nav-link .ph { font-size: 18px; color: #9ca3af; transition: color .18s; }
    .nav-link:hover .ph { color: #4b5563; }

    /* Form inputs */
    .form-input {
      width: 100%;
      padding: 9px 13px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      color: #111827;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }
    .form-input:hover { border-color: #d1d5db; }
    .form-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgb(99 102 241 / 0.12); }
    .form-input::placeholder { color: #9ca3af; }
    select.form-input { cursor: pointer; }

    /* Table */
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      padding: 11px 16px; text-align: left; font-size: 11.5px;
      font-weight: 600; color: #6b7280; text-transform: uppercase;
      letter-spacing: .06em; background: #f9fafb;
      border-bottom: 1px solid #e5e7eb; white-space: nowrap;
    }
    .data-table td { padding: 13px 16px; border-bottom: 1px solid #f3f4f6; color: #374151; vertical-align: middle; }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:nth-child(even) td { background: #fafafa; }
    .data-table tbody tr:hover td { background: #f5f3ff !important; transition: background .12s; }

    /* Btn */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; border: none; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #4338ca; box-shadow: 0 2px 8px rgb(79 70 229 / .35); }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-danger { background: #fef2f2; color: #dc2626; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-sm { padding: 5px 12px; font-size: 13px; }

    /* Badge */
    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; }
    .badge-green  { background: #dcfce7; color: #16a34a; }
    .badge-yellow { background: #fef9c3; color: #ca8a04; }
    .badge-blue   { background: #dbeafe; color: #2563eb; }
    .badge-gray   { background: #f3f4f6; color: #6b7280; }

    /* Card */
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgb(0 0 0 / .06), 0 1px 2px -1px rgb(0 0 0 / .06); border: 1px solid #f0f0f0; }

    /* Toast */
    #toast-container { position: fixed; bottom: 28px; right: 28px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      display: flex; align-items: flex-start; gap: 12px; min-width: 300px; max-width: 380px;
      background: #fff; border-radius: 12px; padding: 14px 16px;
      box-shadow: 0 10px 30px rgb(0 0 0 / .12), 0 2px 8px rgb(0 0 0 / .08);
      border: 1px solid #f0f0f0; animation: toastIn .3s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.removing { animation: toastOut .25s ease forwards; }
    @keyframes toastIn { from { opacity:0; transform: translateY(16px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { to { opacity:0; transform: translateY(8px) scale(.95); } }
    .toast-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast-success .toast-icon { background: #dcfce7; color: #16a34a; }
    .toast-error   .toast-icon { background: #fef2f2; color: #dc2626; }
    .toast-info    .toast-icon { background: #dbeafe; color: #2563eb; }
    .toast-title { font-size: 14px; font-weight: 600; color: #111827; }
    .toast-msg   { font-size: 13px; color: #6b7280; margin-top: 2px; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 /.4); z-index: 500; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
    .modal-box { background: #fff; border-radius: 16px; box-shadow: 0 24px 60px rgb(0 0 0 / .18); width: 100%; animation: modalIn .25s cubic-bezier(.34,1.56,.64,1); }
    @keyframes modalIn { from { opacity:0; transform: scale(.95); } to { opacity:1; transform: scale(1); } }

    /* Page fade-in */
    .page-content { animation: pageFade .3s ease; }
    @keyframes pageFade { from { opacity: 0; transform: translateY(6px); } to { opacity:1; transform:translateY(0); } }

    /* Sidebar group label */
    .nav-group-label { font-size: 10.5px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: .08em; padding: 0 14px; margin: 16px 0 4px; }

    /* HTMX loading indicator */
    .htmx-indicator { opacity: 0; transition: opacity 0.3s; }
    .htmx-request .htmx-indicator { opacity: 1; }
  </style>
</head>

<body class="h-full bg-gray-50">
<div class="flex h-full min-h-screen">

  <!-- ── SIDEBAR ──────────────────────────────────────── -->
  <aside class="w-60 flex-shrink-0 bg-white shadow-sidebar flex flex-col sticky top-0 h-screen overflow-y-auto">

    <!-- Logo -->
    <div class="px-5 py-5 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center">
          <i class="ph ph-flask text-white" style="font-size:16px"></i>
        </div>
        <div>
          <div class="text-sm font-semibold text-gray-900 leading-tight">НИИ Портал</div>
          <div class="text-xs text-gray-400">Стимулирующие надбавки</div>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-1">

      <div class="nav-group-label">Основное</div>

      <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
        <i class="ph ph-house-simple"></i>
        Главная
      </a>
      <a href="/topics" class="nav-link {% if '/topics' in request.url.path %}active{% endif %}">
        <i class="ph ph-book-open"></i>
        Темы НИР
      </a>

      <div class="nav-group-label">Учёт</div>

      <a href="/calendar" class="nav-link {% if '/calendar' in request.url.path %}active{% endif %}">
        <i class="ph ph-calendar-dots"></i>
        Календарь
      </a>
      <a href="/attendance" class="nav-link {% if '/attendance' in request.url.path %}active{% endif %}">
        <i class="ph ph-clipboard-text"></i>
        Табель
      </a>

      <div class="nav-group-label">Аналитика</div>

      <a href="/reports" class="nav-link {% if '/reports' in request.url.path %}active{% endif %}">
        <i class="ph ph-chart-bar"></i>
        Отчёты
      </a>

    </nav>

    <!-- Bottom user block -->
    <div class="px-3 py-4 border-t border-gray-100">
      <div class="flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-gray-50 cursor-pointer">
        <div class="w-7 h-7 rounded-full bg-brand-100 flex items-center justify-content center flex-shrink-0">
          <span class="text-xs font-semibold text-brand-700 w-full text-center">АД</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-xs font-medium text-gray-800 truncate">Администратор</div>
          <div class="text-xs text-gray-400 truncate">admin@nii.local</div>
        </div>
        <i class="ph ph-sign-out text-gray-400 text-base"></i>
      </div>
    </div>
  </aside>

  <!-- ── MAIN ─────────────────────────────────────────── -->
  <main class="flex-1 flex flex-col min-w-0 overflow-x-hidden">

    <!-- Top bar -->
    <header class="bg-white border-b border-gray-100 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
      <div>
        <h1 class="text-lg font-semibold text-gray-900">{% block page_title %}Главная{% endblock %}</h1>
        <p class="text-xs text-gray-400 mt-0.5">{% block page_subtitle %}{% endblock %}</p>
      </div>
      <div class="flex items-center gap-3">
        <!-- HTMX global loading indicator -->
        <span class="htmx-indicator">
          <svg class="animate-spin h-4 w-4 text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
        </span>
        <span class="text-xs text-gray-400" id="js-date"></span>
      </div>
    </header>

    <!-- Page content -->
    <div class="flex-1 px-8 py-7 page-content">
      {% block content %}{% endblock %}
    </div>

  </main>
</div>

<!-- ── TOAST CONTAINER ──────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── GLOBAL SCRIPTS ────────────────────────────────── -->
<script>
  // Date in header
  const d = new Date();
  document.getElementById('js-date').textContent = d.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  // Toast system
  window.toast = function(type, title, msg) {
    const icons = { success: 'check-circle', error: 'x-circle', info: 'info' };
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `
      <div class="toast-icon"><i class="ph ph-${icons[type]||'info'}" style="font-size:17px"></i></div>
      <div class="flex-1 min-w-0">
        <div class="toast-title">${title}</div>
        ${msg ? `<div class="toast-msg">${msg}</div>` : ''}
      </div>
      <button onclick="removeToast(this.parentElement)" class="text-gray-300 hover:text-gray-500 ml-1"><i class="ph ph-x"></i></button>`;
    const c = document.getElementById('toast-container');
    c.appendChild(el);
    setTimeout(() => removeToast(el), 4200);
  };
  window.removeToast = function(el) {
    el.classList.add('removing');
    setTimeout(() => el.remove(), 260);
  };

  // HTMX after-request → show toast from response header
  document.body.addEventListener('htmx:afterRequest', function(evt) {
    const hdrs = evt.detail.xhr.getAllResponseHeaders();
    const status = evt.detail.xhr.status;
    if (status >= 200 && status < 300) {
      const msg = evt.detail.xhr.getResponseHeader('X-Toast-Success');
      if (msg) toast('success', 'Успешно', msg);
    } else {
      const msg = evt.detail.xhr.getResponseHeader('X-Toast-Error');
      if (msg) toast('error', 'Ошибка', msg || 'Что-то пошло не так');
    }
  });

  // Modal helpers
  window.openModal = id => document.getElementById(id).classList.remove('hidden');
  window.closeModal = id => document.getElementById(id).classList.add('hidden');
  // Close on backdrop click
  document.addEventListener('click', e => {
    if (e.target.classList.contains('modal-backdrop')) {
      e.target.closest('[id]').classList.add('hidden');
    }
  });
</script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
